<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stipple Clouds</title>
<meta name="robots" content="noindex" />
<style>
    :root {
        --paper: #fbfaf7;
        --ink: #111;
    }
    html,
    body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        font-family: Georgia, serif;
    }
    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }
    .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        text-align: center;
        box-sizing: border-box;
    }
    h1 {
        margin: 0;
        max-width: 52rem;
        font: italic 400 clamp(2.4rem, 6vw, 5.5rem) / 0.98 Georgia, serif;
        letter-spacing: -0.03em;
        color: var(--ink);
    }
    p {
        margin: 0;
        max-width: 36rem;
        font: 400 1.125rem/1.5 system-ui, sans-serif;
        color: #333;
    }
    .controls {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 0.625rem 0.875rem;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
        font: 12px/1.2 system-ui, sans-serif;
        color: #444;
    }
    .controls label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>

<main class="hero">
    <h1>A product designer who creates with vision</h1>
    <p>I’m Sophia, designing experiences grounded in research and systems thinking, from first insight to a shipped, considered product.</p>
</main>

<div class="controls">
    <label>Sky <input id="cover" type="range" min="0.3" max="0.7" step="0.01" value="0.5" /></label>
    <label>Speed <input id="speed" type="range" min="0" max="3" step="0.1" value="2" /></label>
    <label>Grain <input id="grain" type="range" min="1" max="3" step="1" value="1" /></label>
    <label>Colour
        <select id="colour">
            <option value="blue" selected>Blue sky</option>
            <option value="deep">Deep blue</option>
            <option value="grey">Grey</option>
        </select>
    </label>
</div>

<script>
const VERT = "attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }"
const FRAG = `
precision highp float;
uniform vec2 uRes;     // device px
uniform float uTime;   // seconds (already scaled by speed)
uniform float uCover;  // how much is sky
uniform float uGrain;  // stipple size in device px
uniform vec3 uDotA;    // darker dot colour
uniform vec3 uDotB;    // lighter dot colour

// --- hash + value noise ---
float hash(vec2 p){ p = fract(p*vec2(443.897,441.423)); p += dot(p, p.yx+19.19); return fract((p.x+p.y)*p.x); }
float noise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
    float s = 0.0, a = 0.5;
    mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
    for (int i = 0; i < 5; i++){ s += a*noise(p); p = m*p; a *= 0.5; }
    return s;
}

void main(){
    vec2 px = gl_FragCoord.xy;
    float scale = min(uRes.x, uRes.y);
    // world space: a little wider than tall, so clouds drift as soft banks
    vec2 p = px / scale * vec2(3.6, 4.8);
    float t = uTime;

    // drift sideways, with a gentle warp so edges billow and slowly change shape
    vec2 drift = vec2(t*0.05, t*0.008);
    vec2 w = vec2(fbm(p*0.8 + drift + vec2(0.0, t*0.03)), fbm(p*0.8 + drift + vec2(5.2, 1.3) - t*0.025));
    float f = fbm(p + drift + 0.9*(w - 0.5));
    // puffier: add small round lumps along the edges
    f += 0.12*(noise(p*4.0 + drift*2.0) - 0.5);

    // sky amount: 1 in the sky, 0 inside a cloud; a short, stippled edge
    float sky = smoothstep(uCover - 0.05, uCover + 0.07, f);
    sky *= 0.5 + 0.18*smoothstep(uCover + 0.05, uCover + 0.25, f);

    // stipple: each grain cell is a dot with a fixed random threshold
    vec2 cell = floor(px / uGrain);
    float th = hash(cell);
    float dotOn = step(th, sky);
    // dots vary a little between two tones
    vec3 tone = mix(uDotA, uDotB, hash(cell + 17.0));
    vec3 paper = vec3(0.984, 0.980, 0.969);
    vec3 col = mix(paper, tone, dotOn);
    gl_FragColor = vec4(col, 1.0);
}`

const canvas = document.getElementById("c")
const gl = canvas.getContext("webgl", { antialias: false })
const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(x)); return x }
const prog = gl.createProgram()
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT))
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG))
gl.linkProgram(prog)
gl.useProgram(prog)
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
const loc = gl.getAttribLocation(prog, "a")
gl.enableVertexAttribArray(loc)
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
const u = (n) => gl.getUniformLocation(prog, n)
const uRes = u("uRes"), uTime = u("uTime"), uCover = u("uCover"), uGrain = u("uGrain"), uDotA = u("uDotA"), uDotB = u("uDotB")
const PALETTES = {
    blue: [[0.36, 0.56, 0.86], [0.55, 0.72, 0.94]],
    deep: [[0.16, 0.38, 0.78], [0.33, 0.55, 0.90]],
    grey: [[0.62, 0.62, 0.62], [0.76, 0.76, 0.76]],
}

const cover = document.getElementById("cover"), speed = document.getElementById("speed"), grain = document.getElementById("grain"), colour = document.getElementById("colour")

let dpr = 1
function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2)
    canvas.width = Math.round(innerWidth * dpr)
    canvas.height = Math.round(innerHeight * dpr)
    gl.viewport(0, 0, canvas.width, canvas.height)
}
resize()
addEventListener("resize", resize)

let t = 20, last = performance.now()
const still = matchMedia("(prefers-reduced-motion: reduce)").matches
function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000)
    last = now
    if (!still) t += dt * parseFloat(speed.value)
    gl.uniform2f(uRes, canvas.width, canvas.height)
    gl.uniform1f(uTime, t)
    gl.uniform1f(uCover, parseFloat(cover.value))
    gl.uniform1f(uGrain, parseFloat(grain.value) * dpr)
    const pal = PALETTES[colour.value]
    gl.uniform3fv(uDotA, pal[0])
    gl.uniform3fv(uDotB, pal[1])
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
    requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
